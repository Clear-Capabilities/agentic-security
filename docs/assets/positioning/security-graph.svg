<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-labelledby="t d">
<title id="t">Code Boundaries security graph</title>
<desc id="d">A tree of what the security graph contains: functions, APIs, dependencies, identities, data, findings and services, with an Evidence branch of Static, Proven, Runtime and Artifact. Each entry shows its real maturity as text. Identities are Roadmap. Runtime and Artifact evidence are Preview and bounded: offline telemetry import, and images from archives, an engine or one registry reference tested against stand-ins.</desc>
<rect width="1040" height="700" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8c959f"/></marker></defs><text x="520" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">Code Boundaries: the security graph underneath</text><text x="520" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">What is in the graph today, and what is not yet.</text><rect x="24" y="90" width="520" height="34" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Code</text><rect x="52" y="130" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Functions</text><text x="178" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">in findings and taint chains</text><rect x="52" y="170" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">APIs</text><text x="178" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">routes modelled as sources</text><rect x="52" y="210" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Dependencies</text><text x="178" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">in the SBOM and SCA, not graph nodes</text><rect x="52" y="250" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Identities</text><text x="178" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">not modelled as graph nodes</text><rect x="468.2" y="257" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="502.1" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><rect x="52" y="290" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Data</text><text x="178" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">field-level elements and sensitivity classes</text><rect x="468.2" y="297" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="502.1" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="52" y="330" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Findings</text><text x="178" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">linked to flows</text><rect x="468.2" y="337" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="502.1" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="52" y="370" width="492" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="64" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Services</text><text x="178" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">stores, external parties, queues</text><rect x="468.2" y="377" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="502.1" y="391" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="52" y="410" width="492" height="34" rx="6" fill="#f6f8fa" stroke="#8c959f"/><text x="64" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Evidence</text><rect x="80" y="450" width="464" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="92" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Static</text><text x="170" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">protection and path evidence on every flow</text><rect x="470.2" y="457" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="504.1" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="80" y="488" width="464" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="92" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Proven</text><text x="170" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">stored as a proof record, not drawn on the graph</text><rect x="470.2" y="495" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="504.1" y="509" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="80" y="526" width="464" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="92" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Runtime</text><text x="170" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">offline telemetry import only; not live collection</text><rect x="470.2" y="533" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="504.1" y="547" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="80" y="564" width="464" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="92" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Artifact</text><text x="170" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">archives, engine or one registry ref; stand-in tested</text><rect x="470.2" y="571" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="504.1" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="580" y="90" width="436" height="230" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="596" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">One flow, honestly</text><text x="596" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Same field, same sink, two code paths, two verdicts.</text><text x="596" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A flow with no evidence is never upgraded to</text><text x="596" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">protected.</text><rect x="596" y="196" width="120" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="656" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">card_number</text><line x1="718" y1="213" x2="770" y2="213" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="772" y="196" width="120" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="832" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Payments</text><line x1="894" y1="213" x2="930" y2="213" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="932" y="196" width="70" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="967" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Logs</text><text x="596" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">masked path: evidenced protected</text><text x="596" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">raw path: evidenced gap</text><text x="596" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">no evidence: not assessed</text><rect x="580" y="336" width="436" height="136" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="596" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Also in the graph</text><text x="596" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Blast radius, provenance and cross-repository</text><text x="596" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">federation read this graph. The scanHealth snapshot,</text><text x="596" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">per-language coverage tier and limitations ship inside</text><text x="596" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">every export. Continuous production observation is</text><text x="596" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Roadmap.</text><rect x="596" y="440" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="629.9" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="669.8" y="440" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="703.6999999999999" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text