<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d">
<title id="t">The ten-stage assurance lifecycle</title>
<desc id="d">Discover, Corroborate, Prove, Learn, Scale, Observe, Trace, Fix, Verify, Detect, in two rows with a feedback loop from Detect, Verify and Learn back to Discover and Corroborate. Each stage lists its guiding question and the maturity labels (GA, Preview, Labs, Roadmap) of the capabilities at that stage. Detect is Labs and Roadmap.</desc>
<rect width="1040" height="500" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8c959f"/></marker></defs><text x="520" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">The assurance lifecycle</text><text x="520" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">Ten stages. Each answers one question and shows the maturity of what ships at that stage.</text><rect x="24" y="84" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">1. Discover</text><text x="36" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">What might be wrong?</text><rect x="36" y="206" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="51.4" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><rect x="72.8" y="206" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="106.7" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><line x1="206" y1="160" x2="224" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="226" y="84" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="238" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">2. Corroborate</text><text x="238" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">What independent evidence</text><text x="238" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">supports or refutes the</text><text x="238" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">finding?</text><rect x="238" y="206" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="253.4" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><rect x="274.8" y="206" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="308.70000000000005" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><line x1="408" y1="160" x2="426" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="428" y="84" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="440" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">3. Prove</text><text x="440" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Can exploitability be</text><text x="440" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">mechanically demonstrated?</text><rect x="440" y="206" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="473.9" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><line x1="610" y1="160" x2="628" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="84" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="642" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">4. Learn</text><text x="642" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Can a confirmed novel</text><text x="642" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">weakness become reusable</text><text x="642" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">deterministic knowledge?</text><rect x="642" y="206" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="664.8" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><rect x="693.6" y="206" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="727.5" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><line x1="812" y1="160" x2="830" y2="160" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="84" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="844" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">5. Scale</text><text x="844" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Where else does this</text><text x="844" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">weakness exist?</text><rect x="844" y="206" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="877.9" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="917.8" y="206" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="940.5999999999999" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><rect x="24" y="272" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">6. Observe</text><text x="36" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">What has actually occurred</text><text x="36" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">at runtime?</text><rect x="36" y="394" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="69.9" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="109.80000000000001" y="394" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="143.70000000000002" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><line x1="206" y1="348" x2="224" y2="348" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="226" y="272" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="238" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">7. Trace</text><text x="238" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">How does risk connect</text><text x="238" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">through code, data,</text><text x="238" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">architecture, provenance,</text><text x="238" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">and artifacts?</text><rect x="238" y="394" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="271.9" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><line x1="408" y1="348" x2="426" y2="348" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="428" y="272" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="440" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">8. Fix</text><text x="440" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">What is the safest</text><text x="440" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">remediation?</text><rect x="440" y="394" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="455.4" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><line x1="610" y1="348" x2="628" y2="348" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="272" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="642" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">9. Verify</text><text x="642" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Did the fix work, and which</text><text x="642" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">verification legs actually</text><text x="642" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">ran?</text><rect x="642" y="394" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="657.4" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><rect x="678.8" y="394" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="712.6999999999999" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="752.5999999999999" y="394" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="775.3999999999999" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><line x1="812" y1="348" x2="830" y2="348" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="272" width="180" height="152" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="844" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">10. Detect</text><text x="844" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Was exploitation observed</text><text x="844" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">and can recurrence be</text><text x="844" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">detected?</text><rect x="844" y="394" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="866.8" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><rect x="895.6" y="394" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="929.5" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><line x1="922" y1="238" x2="922" y2="266" stroke="#8c959f" stroke-width="2" /><path d="M 922 236 L 922 244 L 114 244 L 114 270" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="520" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Detect / Verify / Learn feed back into a stronger Discover and Corroborate  (the loop, ↻)</text><text x="520" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">The operational finding workflow  Find → Prove → Hunt → Scope → Fix → Verify → Detect  is a subset of these ten stages.</text><text x="24" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Maturity (always written out):</text><rect x="214" y="468" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="229.4" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><rect x="250.8" y="468" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="284.70000000000005" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="324.6" y="468" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="347.40000000000003" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><rect x="376.20000000000005" y="468" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="410.1" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text>
</svg>
