<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="t d">
<title id="t">Traditional security versus Agentic Security</title>
<desc id="d">Two rows. Traditional security is scan, find, ticket. Agentic Security is discover, prove, understand, fix, verify, learn, and the loop repeats. The agentic row is a simplified view of the ten-stage lifecycle, and learning is Labs and Roadmap in the product today.</desc>
<rect width="1040" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8c959f"/></marker></defs><text x="520" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">Traditional security versus Agentic Security</text><text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#57606a" text-anchor="start">Traditional security</text><rect x="24" y="104" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f"/><text x="89" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f2328" text-anchor="middle">SCAN</text><line x1="156" y1="124" x2="182" y2="124" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="184" y="104" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f"/><text x="249" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f2328" text-anchor="middle">FIND</text><line x1="316" y1="124" x2="342" y2="124" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="344" y="104" width="130" height="40" rx="8" fill="#ffffff" stroke="#8c959f"/><text x="409" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f2328" text-anchor="middle">TICKET</text><text x="24" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">Agentic Security</text><rect x="24" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="98" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">DISCOVER</text><line x1="174" y1="222" x2="188" y2="222" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="264" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">PROVE</text><line x1="340" y1="222" x2="354" y2="222" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="356" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="430" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">UNDERSTAND</text><line x1="506" y1="222" x2="520" y2="222" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="522" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="596" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">FIX</text><line x1="672" y1="222" x2="686" y2="222" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="688" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="762" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">VERIFY</text><line x1="838" y1="222" x2="852" y2="222" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="854" y="202" width="148" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="928" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">LEARN ↻</text><text x="24" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A simplified public view of the ten-stage lifecycle. LEARN is Labs and Roadmap today; see the maturity model for every stage.</text>
</svg>
