<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="t d">
<title id="t">The evidence ladder</title>
<desc id="d">Eight rungs from Candidate to Fix Verified. For each rung: what it establishes, what it does not establish, and the product field that represents it today. Runtime observation and remediation are not finding-level machine states. Scan completeness is a precondition for every rung rather than a rung.</desc>
<rect width="1040" height="640" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8c959f"/></marker></defs><text x="520" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">The evidence ladder</text><text x="520" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">Separate kinds of evidence. Raising one never silently raises another.</text><text x="250" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#57606a" text-anchor="start">Establishes</text><text x="560" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#57606a" text-anchor="start">Does not establish</text><text x="850" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#57606a" text-anchor="start">Product field today</text><rect x="24" y="84" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">1. Candidate</text><text x="250" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A detector raised a claim at a location.</text><text x="560" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that it is true or reachable.</text><text x="850" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">CANDIDATE</text><line x1="48" y1="138" x2="48" y2="147" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="146" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">2. Static Evidence</text><text x="250" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A code-level reason, such as a</text><text x="250" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">source-to-sink path.</text><text x="560" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that the path executes.</text><text x="850" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">chain[], proof.verdict</text><line x1="48" y1="200" x2="48" y2="209" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="208" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">3. Corroborated</text><text x="250" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Independent analyses agree; no blocking</text><text x="250" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">control found.</text><text x="560" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: truth. Analyses can share a blind</text><text x="560" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">spot.</text><text x="850" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start"></text><text x="850" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">STATICALLY_CORROBORATED,</text><text x="850" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">corroboration</text><line x1="48" y1="262" x2="48" y2="271" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="270" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">4. Reachable</text><text x="250" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">An entry point can reach the flow.</text><text x="560" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that it is exposed in production.</text><text x="850" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">reachable, unreachable</text><line x1="48" y1="324" x2="48" y2="333" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="332" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">5. Reproduced / Exploit Confirmed</text><text x="250" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A confined reproducer produced the</text><text x="250" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">oracle effect, replayed independently.</text><text x="560" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: anything when absent.</text><text x="560" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not-reproduced is no safety proof.</text><text x="850" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">REPRODUCED,</text><text x="850" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">EXPLOIT_CONFIRMED</text><line x1="48" y1="386" x2="48" y2="395" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="394" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">6. Observed in Runtime</text><text x="250" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Imported telemetry matched a graph node</text><text x="250" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">(offline).</text><text x="560" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that exploitation occurred.</text><text x="850" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">graph-level status,</text><text x="850" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">not a finding state</text><line x1="48" y1="448" x2="48" y2="457" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="456" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">7. Remediated</text><text x="250" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">A patch was applied after the legs that</text><text x="250" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">ran passed.</text><text x="560" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that the weakness is gone</text><text x="560" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">everywhere.</text><text x="850" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">applied fix; tier</text><line x1="48" y1="510" x2="48" y2="519" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="518" width="992" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">8. Fix Verified</text><text x="250" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Named legs passed; full or degraded is</text><text x="250" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">stated.</text><text x="560" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not: that no other weakness exists.</text><text x="850" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">FIX_VERIFIED,</text><text x="850" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">verifiedFull</text><text x="24" y="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Scan completeness (scanHealth) is a precondition for every rung, not a rung. Severity is a separate fact from all of these.</text>
</svg>
