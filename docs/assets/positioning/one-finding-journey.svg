<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d">
<title id="t">One finding's journey</title>
<desc id="d">A SQL injection from the demo app through ten stages. Discover is GA and Preview. Corroborate is GA and the scan was partial. Prove is Preview and nothing ran. Learn is Labs and was not run. Scale is Preview and Labs. Observe is Preview and Roadmap and no telemetry was imported. Trace is Preview. Fix and Verify are GA and no mechanical fix existed. Detect is Labs and Roadmap: a detection was refused without a proof.</desc>
<rect width="1040" height="560" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8c959f"/></marker></defs><text x="520" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">One finding's journey</text><text x="520" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">A real SQL injection from the demo app, followed through all ten stages. What ran, and what honestly did not.</text><rect x="24" y="84" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">1. Discover</text><rect x="36" y="124" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="51.4" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><rect x="72.8" y="124" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="106.7" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><text x="36" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Found by a structural</text><text x="36" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">detector. Hunt could not</text><text x="36" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">run and said so.</text><line x1="206" y1="177" x2="224" y2="177" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="226" y="84" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="238" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">2. Corroborate</text><rect x="238" y="124" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="253.4" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><text x="238" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Three analyses agree.</text><text x="238" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Scan status was partial.</text><line x1="408" y1="177" x2="426" y2="177" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="428" y="84" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="440" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">3. Prove</text><rect x="440" y="124" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="473.9" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><text x="440" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Nothing ran: no</text><text x="440" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">reproducer, and none can</text><text x="440" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">be generated for CWE-89.</text><line x1="610" y1="177" x2="628" y2="177" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="84" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="642" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">4. Learn</text><rect x="642" y="124" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="664.8" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><text x="642" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Not run. Already covered</text><text x="642" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">by an existing rule.</text><line x1="812" y1="177" x2="830" y2="177" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="84" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="844" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">5. Scale</text><rect x="844" y="124" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="877.9" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="917.8" y="124" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="940.5999999999999" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><text x="844" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Sweep seeded elsewhere.</text><text x="844" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">No fleet configured.</text><rect x="24" y="298" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="36" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">6. Observe</text><rect x="36" y="338" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="69.9" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><rect x="109.80000000000001" y="338" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="143.70000000000002" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><text x="36" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">No telemetry imported:</text><text x="36" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">status unavailable.</text><line x1="206" y1="391" x2="224" y2="391" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="226" y="298" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="238" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">7. Trace</text><rect x="238" y="338" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/><text x="271.9" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">Preview</text><text x="238" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Graph built. Blast</text><text x="238" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">radius computed. No Git</text><text x="238" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">origin.</text><line x1="408" y1="391" x2="426" y2="391" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="428" y="298" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="440" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">8. Fix</text><rect x="440" y="338" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="455.4" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><text x="440" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">No mechanical fix</text><text x="440" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">exists. The CLI said so.</text><line x1="610" y1="391" x2="628" y2="391" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="630" y="298" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="642" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">9. Verify</text><rect x="642" y="338" width="30.8" height="20" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/><text x="657.4" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">GA</text><text x="642" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Finding verifier:</text><text x="642" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">cannot-verify. No patch</text><text x="642" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">to verify.</text><line x1="812" y1="391" x2="830" y2="391" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="298" width="180" height="186" rx="10" fill="#f6f8fa" stroke="#8c959f"/><text x="844" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">10. Detect</text><rect x="844" y="338" width="45.6" height="20" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 3"/><text x="866.8" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labs</text><rect x="895.6" y="338" width="67.80000000000001" height="20" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="2 3"/><text x="929.5" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#57606a" text-anchor="middle">Roadmap</text><text x="844" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Detection refused</text><text x="844" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">without a proof; forced</text><text x="844" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">draft: confidence 0.1,</text><text x="844" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">not validated.</text><text x="520" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Evidence reached: corroborated, falsification survived, reachable. Not proven, not runtime-observed, not fix-verified.</text><text x="520" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">Every row is real captured output in docs/workflows/one-findings-journey.md.</text>
