    name: Scan health
    lifecycleStages: [corroborate]
    maturity: GA
    since: 0.178.0
    contract: docs/trust/scan-health.md
    contractTest: scanner/test/scan-health.test.js
    gate: contract-conformance
    platforms: [linux:test-shard]
    limits: docs/trust/scan-health.md#what-scan-health-does-not-tell-you
    establishes: Whether every analyzer finished, which files and feeds were incomplete or stale, and therefore whether a clean result may be called clean.
