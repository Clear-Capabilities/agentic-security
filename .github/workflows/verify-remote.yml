# Hosted verification for the supervised loop (scripts/loop-engineering/lib/remote.mjs).
#
# Dispatched by the loop controller when a requirement's suite needs a tool this machine lacks (`nix`, a booted NixOS). It runs the suite
# for ONE requirement at ONE commit and uploads what it saw; it never decides pass or fail on the controller's behalf. The controller:
#   * finds this run by the nonce in its name,
#   * requires `meta.json` to name the same sha, to carry a digest of the watched files that equals its own, and to carry a TAP file per leg
#     whose hash matches,
#   * maps the TAP's tagged tests to the requirement's criteria exactly as it does for a local run.
# A leg whose tests fail still COMPLETES (its exit code and TAP are the evidence); only infrastructure trouble fails a job.
#
# Not a CI gate: it runs only on request. See docs/guides/loop-engineering.md ("Hosted verification").

name: verify-remote
run-name: verify ${{ inputs.requirement }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      requirement: { description: 'Requirement id (NIX-011 or NIX-012)', required: true, type: string }
      sha: { description: 'Commit to test; must be this workflow''s own commit', required: true, type: string }
      watch: { description: 'JSON array of watch globs the controller judges the requirement on', required: true, type: string }
      nonce: { description: 'Controller-chosen nonce used to find this run', required: true, type: string }
      target: { description: 'nix or nixos', required: true, type: string }

permissions:
  contents: read

env:
  OUT: /tmp/verify-out

jobs:
  nix:
    if: inputs.target == 'nix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.sha }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Bind this run to the requested commit and the watched bytes
        env: { WATCH: '${{ inputs.watch }}' }
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "${{ github.workflow_sha }}" = "${{ inputs.sha }}"
          mkdir -p "$OUT"
          node scripts/loop-engineering/digest.mjs "$WATCH" > "$OUT/digest.json"
          cat "$OUT/digest.json"
      - name: Install Nix (attempt 1)
        id: nix_install_1
        uses: cachix/install-nix-action@v31
        continue-on-error: true
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
      - name: Install Nix (attempt 2, only when attempt 1 failed or timed out)
        if: steps.nix_install_1.outcome != 'success'
        uses: cachix/install-nix-action@v31
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
      - run: npm ci
        working-directory: scanner
        timeout-minutes: 10
      - name: Run the suite (TAP) against a real evaluator
        working-directory: scanner
        continue-on-error: true
        run: |
          set +e
          node --test --test-reporter=tap test/nix/nix-eval-isolation.test.js > "$OUT/nix.tap" 2> "$OUT/nix.stderr"
          echo $? > "$OUT/nix.exit"
        timeout-minutes: 30
      - name: Describe the leg
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process"), crypto = require("crypto");
            const out = process.env.OUT;
            const tap = fs.existsSync(out + "/nix.tap") ? fs.readFileSync(out + "/nix.tap") : Buffer.alloc(0);
            const leg = { name: "nix", system: "x86_64-linux", tap: "nix.tap", tapSha256: crypto.createHash("sha256").update(tap).digest("hex"),
              exitCode: Number(fs.existsSync(out + "/nix.exit") ? fs.readFileSync(out + "/nix.exit", "utf8") : 1),
              toolVersions: { nix: cp.execSync("nix --version").toString().trim(), node: process.version } };
            fs.writeFileSync(out + "/leg-nix.json", JSON.stringify(leg));
          '
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with: { name: leg-nix, path: /tmp/verify-out, if-no-files-found: error }
        timeout-minutes: 10

  nixos-x86:
    if: inputs.target == 'nixos'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.sha }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Bind this run to the requested commit and the watched bytes
        env: { WATCH: '${{ inputs.watch }}' }
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "${{ github.workflow_sha }}" = "${{ inputs.sha }}"
          mkdir -p "$OUT"
          node scripts/loop-engineering/digest.mjs "$WATCH" > "$OUT/digest.json"
          cat "$OUT/digest.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      # Two bounded attempts. The installer is a network download that has hung before; a hang becomes a 10 minute failure of
      # attempt 1 and attempt 2 runs. BOTH attempts stay visible in the log; attempt 2 is skipped when attempt 1 succeeds, and a
      # failure of attempt 2 fails the job.
      - name: Install Nix (attempt 1)
        id: nix_install_1
        uses: cachix/install-nix-action@v31
        continue-on-error: true
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: Install Nix (attempt 2, only when attempt 1 failed or timed out)
        if: steps.nix_install_1.outcome != 'success'
        uses: cachix/install-nix-action@v31
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: NixOS guest (x86_64, KVM) runs the NIX-012 suite inside it
        continue-on-error: true
        run: |
          set +e
          nix build .#checks.x86_64-linux.nixos-host -L --out-link /tmp/nixresult-x86 > "$OUT/build-x86_64.log" 2>&1
          echo $? > "$OUT/x86.exit"
          cp /tmp/nixresult-x86/nixos-host-x86_64-linux.tap "$OUT/nixos-x86_64.tap" 2>/dev/null || : > "$OUT/nixos-x86_64.tap"
        timeout-minutes: 90
      - name: Describe the leg
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process"), crypto = require("crypto");
            const out = process.env.OUT;
            const tap = fs.readFileSync(out + "/nixos-x86_64.tap");
            const leg = { name: "x86_64-linux", system: "x86_64-linux", tap: "nixos-x86_64.tap", tapSha256: crypto.createHash("sha256").update(tap).digest("hex"),
              exitCode: Number(fs.existsSync(out + "/x86.exit") ? fs.readFileSync(out + "/x86.exit", "utf8") : 1),
              toolVersions: { nix: cp.execSync("nix --version").toString().trim(), node: process.version } };
            fs.writeFileSync(out + "/leg-x86_64-linux.json", JSON.stringify(leg));
          '
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with: { name: leg-x86_64-linux, path: /tmp/verify-out, if-no-files-found: error }
        timeout-minutes: 10

  nixos-aarch64-emulated:
    if: inputs.target == 'nixos'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.sha }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Bind this run to the requested commit and the watched bytes
        env: { WATCH: '${{ inputs.watch }}' }
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test "${{ github.workflow_sha }}" = "${{ inputs.sha }}"
          mkdir -p "$OUT"
          node scripts/loop-engineering/digest.mjs "$WATCH" > "$OUT/digest.json"
          cat "$OUT/digest.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      # Two bounded attempts. The installer is a network download that has hung before; a hang becomes a 10 minute failure of
      # attempt 1 and attempt 2 runs. BOTH attempts stay visible in the log; attempt 2 is skipped when attempt 1 succeeds, and a
      # failure of attempt 2 fails the job.
      - name: Install Nix (attempt 1)
        id: nix_install_1
        uses: cachix/install-nix-action@v31
        continue-on-error: true
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: Install Nix (attempt 2, only when attempt 1 failed or timed out)
        if: steps.nix_install_1.outcome != 'success'
        uses: cachix/install-nix-action@v31
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: Register the aarch64 user-mode emulator (for the few aarch64 derivations built here)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          sudo sh -c 'echo "extra-platforms = aarch64-linux" >> /etc/nix/nix.conf'
          sudo systemctl restart nix-daemon
        timeout-minutes: 15
      - name: Emulated aarch64 NixOS guest (qemu TCG) runs the NIX-012 suite inside it
        continue-on-error: true
        # At most two attempts, never silent: a failed first attempt keeps its own log and exit code in the uploaded evidence
        # (build-aarch64-attempt1.log, aarch64.attempt1.exit) and is announced here, and the leg's recorded exit code is the SECOND
        # attempt's, so a retry can never present a failure as a pass without that being on the record.
        run: |
          set +e
          timeout 150m nix build .#checks.x86_64-linux.nixos-host-aarch64-emulated -L --out-link /tmp/nixresult-aarch64 > "$OUT/build-aarch64.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=emulated aarch64 attempt 1 FAILED::exit $rc; its log is kept as build-aarch64-attempt1.log in the evidence. Retrying once."
            cp "$OUT/build-aarch64.log" "$OUT/build-aarch64-attempt1.log"
            echo "$rc" > "$OUT/aarch64.attempt1.exit"
            echo '--- tail of the attempt 1 log ---'; tail -n 60 "$OUT/build-aarch64-attempt1.log"
            timeout 150m nix build .#checks.x86_64-linux.nixos-host-aarch64-emulated -L --out-link /tmp/nixresult-aarch64 > "$OUT/build-aarch64.log" 2>&1
            rc=$?
            echo "attempt 2 exit: $rc"
          fi
          echo $rc > "$OUT/aarch64.exit"
          cp /tmp/nixresult-aarch64/nixos-host-aarch64-linux.tap "$OUT/nixos-aarch64.tap" 2>/dev/null || : > "$OUT/nixos-aarch64.tap"
        timeout-minutes: 330
      - name: Describe the leg
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process"), crypto = require("crypto");
            const out = process.env.OUT;
            const tap = fs.readFileSync(out + "/nixos-aarch64.tap");
            const leg = { name: "aarch64-linux-emulated", system: "aarch64-linux", tap: "nixos-aarch64.tap", tapSha256: crypto.createHash("sha256").update(tap).digest("hex"),
              exitCode: Number(fs.existsSync(out + "/aarch64.exit") ? fs.readFileSync(out + "/aarch64.exit", "utf8") : 1),
              toolVersions: { nix: cp.execSync("nix --version").toString().trim(), node: process.version, emulation: "qemu-system-aarch64 TCG on an x86_64 KVM host" } };
            fs.writeFileSync(out + "/leg-aarch64-linux-emulated.json", JSON.stringify(leg));
          '
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with: { name: leg-aarch64-linux-emulated, path: /tmp/verify-out, if-no-files-found: error }
        timeout-minutes: 10

  collect:
    needs: [nix, nixos-x86, nixos-aarch64-emulated]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { path: legs }
        timeout-minutes: 10
      - name: Assemble meta.json (what ran, at which commit, over which bytes)
        env:
          WATCH: '${{ inputs.watch }}'
          REQ: '${{ inputs.requirement }}'
          SHA: '${{ inputs.sha }}'
          WORKFLOW_SHA: '${{ github.workflow_sha }}'
        run: |
          mkdir -p verify
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const legs = [], files = new Set(); let digest = null;
            for (const d of fs.existsSync("legs") ? fs.readdirSync("legs") : []) {
              const dir = path.join("legs", d);
              for (const f of fs.readdirSync(dir)) {
                if (!fs.statSync(path.join(dir, f)).isFile()) continue;   // only files: a symlink to a store directory is not evidence
                fs.copyFileSync(path.join(dir, f), path.join("verify", f));
                if (/^leg-.*\.json$/.test(f)) legs.push(JSON.parse(fs.readFileSync(path.join(dir, f), "utf8")));
                if (f === "digest.json") digest = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8")).digest;
              }
            }
            const meta = { schema: 1, requirement: process.env.REQ, sha: process.env.SHA, workflowSha: process.env.WORKFLOW_SHA,
              treeDigest: digest, watchSha256: crypto.createHash("sha256").update(process.env.WATCH).digest("hex"), legs,
              runner: process.env.RUNNER_OS, finishedAt: new Date().toISOString() };
            fs.writeFileSync("verify/meta.json", JSON.stringify(meta, null, 1));
            console.log(JSON.stringify(meta, null, 1));
          '
      - uses: actions/upload-artifact@v4
        with: { name: 'verify-${{ inputs.requirement }}', path: verify, if-no-files-found: error }
        timeout-minutes: 10
