name: Scanner F1 benchmark

# Internal regression gate. Runs on every PR that touches scanner source or
# benchmark data, and on pushes to main. Fails if:
#  - synthetic F1 drops below baseline (or any per-family floor breached)
#  - --strict-no-unknown surfaces a vuln string not mapped in _familyMap
#  - any of the realworld benchmarks (Juice Shop / Snyk Goof / NodeGoat) drops
#    below 100% F1
#  - OWASP Benchmark F1 drops more than 2pp below the recorded baseline
#
# The bench output (bench-fps.json / bench-fns.json) is uploaded as an artifact
# so reviewers can diff what changed.

# PRD R2 — these are TREND jobs, not correctness gates, and they no longer run
# on push to main.
#
# They used to. On 2026-08-09 a publish was blocked for 15+ minutes by
# `realworld-bench` while 8 of 9 checks were green, because the release gate
# required every check on the commit. A detection-rate measurement against
# public vulnerable apps tells you whether the engine is getting better or
# worse; it does not tell you whether THIS build is publishable. Blocking a
# release on it conflates the two.
#
# What replaces the push trigger is a daily schedule, so drift is still caught
# within a day and on a fixed cadence — which is a better shape for a trend
# signal than a noisy per-commit sample anyway. Pull requests keep their
# trigger: that is where a regression should be caught, and nothing is waiting
# on a PR the way a publish waits on main.
#
# These jobs are listed as `informational` in .github/required-checks.json, so
# even when they DO report on a commit, a failure warns loudly at publish time
# rather than blocking. See scripts/release-check.mjs#evaluateRemoteCi.
on:
  pull_request:
    paths:
      - 'scanner/src/**'
      - 'scanner/test/**'
      - 'scanner/package.json'
      - '.github/workflows/bench.yml'
  schedule:
    # 04:17 UTC daily. Off the hour on purpose — scheduled runs cluster on the
    # hour across GitHub and get queued behind everyone else's cron.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. Both jobs only need to read the repo;
# actions/upload-artifact does not require any write scopes.
# (CodeQL actions/missing-workflow-permissions.)
permissions:
  contents: read

# The actions/* pins below are all on majors that declare `runs.using:
# node24` natively (checkout v7, setup-node v7, cache v6, upload-artifact
# v7), so they no longer need this opt-in. It is kept as a backstop for any
# action reached indirectly that still declares node20, ahead of GitHub's
# June 16, 2026 forced migration; drop it once nothing in this file warns.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  synthetic-bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 'lts/*' }
      - name: Install scanner deps
        working-directory: scanner
        run: npm ci
      - name: Build scanner bundle
        working-directory: scanner
        run: npm run build
      - name: Run unit tests
        working-directory: scanner
        run: npm test
      - name: Run synthetic F1 bench (strict)
        working-directory: scanner
        run: node test/benchmark/bench.js --strict-no-unknown
      - name: Upload synthetic FP/FN registry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-synthetic-${{ github.run_id }}
          path: |
            scanner/test/benchmark/bench-fps.json
            scanner/test/benchmark/bench-fns.json
            scanner/test/benchmark/baseline.json

  realworld-bench:
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: synthetic-bench` (removed 2026-09-12, SARD
    # premortem finding F12). Both are already `informational` in
    # required-checks.json — a `needs:` dependency between two non-blocking
    # trend jobs bought nothing but a silent single point of failure: when
    # synthetic-bench regressed (a real, unrelated F1 drop, 91.3%->85.9%,
    # first observed 2026-09-08), realworld-bench was silently SKIPPED on
    # every scheduled run for 5+ consecutive days with no alert, because a
    # skip isn't a failure GitHub surfaces the same way. That silently blanked
    # visibility into the sard-juliet-java trend entry too. Each job should
    # report its own trend independently; a broken unit-test/synthetic-corpus
    # run in one is not evidence the real-world/SARD scan surface is broken.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 'lts/*' }
      - name: Install scanner deps
        working-directory: scanner
        run: npm ci
      # Cache the cloned benchmark repos across runs (keyed on the manifest
      # SHA — bumping any pinned commit invalidates the cache).
      - name: Cache benchmark repos
        uses: actions/cache@v6
        with:
          path: scanner/test/benchmark/realworld/.bench-cache
          key: bench-cache-${{ hashFiles('scanner/test/benchmark/realworld/manifest.json') }}
      # `--all` runs one child process per app (see the PROCESS MODEL note at
      # the top of bench-realworld.js). Peak memory is therefore bounded by the
      # LARGEST SINGLE APP rather than the sum of all of them, which is what
      # previously killed this job: everything shared one heap, so the sweep
      # was hostage to the manifest's biggest target (~28k Java files, 13,366
      # expected true positives — an order of magnitude beyond anything else).
      # Raising the ceiling was tried and did not help; isolating the workload
      # is the structural fix, and the 6 GB ceiling below is now a per-app
      # bound rather than a whole-sweep one.
      #
      # Do not raise this number. If ONE app alone cannot finish under it, that
      # is a leak or an unbounded accumulator inside that app's scan, and the
      # answer is a profile — a bigger heap is how a real leak stays hidden.
      #
      # The bench exits non-zero if any app fails, but we defer that to the
      # enforcement step below so the results still get printed and uploaded.
      # A failure you can read beats a failure you can only infer from $?.
      - name: Run realworld bench (JSON)
        working-directory: scanner
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set +e
          node test/benchmark/realworld/bench-realworld.js --all --json > /tmp/realworld.json
          echo "$?" > /tmp/realworld.exit
          set -e
          head -200 /tmp/realworld.json
          echo "bench exit code: $(cat /tmp/realworld.exit)"
      - name: Enforce per-app F1 floors
        run: |
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("/tmp/realworld.json","utf8"));
            // Per-app F1 floors. The 100% floors on JS apps were
            // aspirational and pre-dated the integration-block detectors
            // (PQC, web3, crypto-protocol, ml-supply-chain, etc.) that
            // fire on real-world JS code. bench-realworld.js now sets
            // AGENTIC_SECURITY_NO_INTEGRATION=1 to preserve apples-to-
            // apples regression testing; floors below allow ~5-10pp
            // headroom under the locally-achieved values:
            //   juice-shop  69.6% local → floor 0.60
            //   snyk-goof   72.0% local → floor 0.65
            //   nodegoat    82.1% local → floor 0.75
            // Raising these requires expected.json maintenance.
            const FLOORS = {
              "juice-shop":      0.60,
              "snyk-goof":       0.65,
              "nodegoat":        0.75,
              "owasp-benchmark": 0.95,
              "sard-juliet-java": 0.95,
            };
            let failed = false;
            // A crashed or errored app fails the run whether or not it
            // declares an F1 floor. Checking this BEFORE the floor lookup is
            // the point: an app nobody set a floor for is exactly the app
            // whose crash would otherwise pass unnoticed, and a silently
            // missing app is worse than a loudly failing one.
            for (const res of r.results) {
              if (res.error) { console.error(`FAIL ${res.name}: ERROR ${res.error}`); failed = true; }
            }
            // The bench exit code is authoritative for "did every app run".
            const benchExit = parseInt(fs.readFileSync("/tmp/realworld.exit","utf8").trim(), 10);
            if (benchExit !== 0) {
              console.error(`FAIL benchmark process exited ${benchExit}`);
              failed = true;
            }
            // Every floored app must be PRESENT. A floor on an app that never
            // appears in the results enforces nothing at all.
            const present = new Set(r.results.map(x => x.name));
            for (const name of Object.keys(FLOORS)) {
              if (!present.has(name)) { console.error(`FAIL ${name}: absent from results`); failed = true; }
            }
            for (const res of r.results) {
              const floor = FLOORS[res.name];
              if (floor == null) continue;
              if (res.error) continue; // already counted above
              const f1 = res.f1 || 0;
              const ok = f1 + 1e-6 >= floor;
              const tag = ok ? "PASS" : "FAIL";
              console.log(`${tag} ${res.name}: F1=${(f1*100).toFixed(1)}% (floor ${(floor*100).toFixed(0)}%)`);
              if (!ok) failed = true;
            }
            process.exit(failed ? 1 : 0);
          '
      - name: Upload realworld results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-realworld-${{ github.run_id }}
          path: /tmp/realworld.json

  # SARD_AGENTIC_SECURITY_PRD.md Phase 10 — deliberately SEPARATE from
  # `realworld-bench` above, not folded into it. `realworld-bench`'s own
  # `sard-juliet-java` entry runs WITHOUT `--blind`, so its 95% F1 floor is
  # measuring whether the corpus-shape-aware fallback paths (bench-shape/
  # index.js, gated behind AGENTIC_SECURITY_BENCH_SHAPE and force-disabled
  # under --blind) still work — a legitimate regression signal for THAT
  # subsystem, but not a statement about genuine detection quality (a scanner
  # reading Juliet folder names trivially clears 95%). This job runs the
  # PRD's actual ask: a leakage-clean (--blind --scramble-identifiers),
  # vulnerability-level (-strict manifest entries), CI-fast (--cwe subset,
  # ~2-3 min) smoke measurement, reported as a trend — same "informational,
  # not blocking" tier as realworld-bench/synthetic-bench above, and for the
  # identical reason (PRD R2): a detection-quality trend is not a statement
  # about whether THIS build is publishable. Registered in
  # .github/required-checks.json's `informational` list — a job observed on
  # a commit but absent from both lists fails scanner/test/release-check.
  # test.js's completeness check, so this registration is required, not
  # optional.
  sard-blind-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 'lts/*' }
      - name: Install scanner deps
        working-directory: scanner
        run: npm ci
      - name: Cache Juliet Java clone
        uses: actions/cache@v6
        with:
          path: scanner/test/benchmark/realworld/.bench-cache
          key: sard-cache-${{ hashFiles('scanner/test/benchmark/realworld/manifest.json') }}
      - name: Run SARD blind smoke (5 representative CWEs)
        working-directory: scanner
        run: npm run bench:sard:smoke
      - name: Upload SARD smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sard-smoke-${{ github.run_id }}
          # Per bench/README.md's policy, these numbers are never committed —
          # this artifact is a run-scoped CI download, not a repo file.
          path: bench/sard/reports/latest.json
      # Adversarial-premortem remediation (F13): compare-baseline.mjs's own
      # header has said since it was written that a hosted CI environment
      # wanting this gate "needs to persist baseline.json as a build
      # cache/artifact across runs itself" — this was never actually done
      # until now. A GitHub Actions cache, not a git commit, is the
      # persistence mechanism, so this does not touch bench/README.md's
      # "no benchmark scores committed to this repo" policy at all — nothing
      # here is ever visible in the repository itself, only inside CI's own
      # ephemeral cache storage.
      #
      # DELIBERATELY a single fixed cache key, never restore-keys/fallback
      # matching, and this job NEVER calls --update-baseline itself: the
      # first successful run ever seeds the baseline (via the miss-path
      # below); every run after that only CHECKS against it. Auto-updating
      # the baseline on every green run would let ordinary run-to-run drift
      # become the new normal one small step at a time — exactly the silent
      # baseline creep this gate exists to catch, self-inflicted. Bump the
      # key's `-v1` suffix by hand (a one-line, reviewed diff) the deliberate
      # way a maintainer accepts a real, intentional improvement — mirroring
      # `--update-baseline`'s own local-workflow requirement that a human
      # decide, never something CI decides on its own.
      - name: Restore SARD baseline cache
        id: sard-baseline-cache
        uses: actions/cache/restore@v6
        with:
          path: bench/sard/reports/baseline.json
          key: sard-blind-smoke-baseline-v1
      - name: Seed SARD baseline (first run only — cache miss)
        if: steps.sard-baseline-cache.outputs.cache-hit != 'true'
        working-directory: scanner
        run: npm run bench:sard:update-baseline
      - name: Save seeded SARD baseline
        if: steps.sard-baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: bench/sard/reports/baseline.json
          key: sard-blind-smoke-baseline-v1
      - name: Check SARD regression gate against the persisted baseline
        if: steps.sard-baseline-cache.outputs.cache-hit == 'true'
        working-directory: scanner
        run: npm run bench:sard:check-baseline
