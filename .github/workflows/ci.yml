# agentic-security — repository CI gate.
# Runs the scanner test suite and the CVE-replay corpus baseline check on every
# push / PR. The corpus check fails the build on ANY drift from the committed
# baseline — a regressed entry, a removed entry, or a NEW entry that does not
# pass (the v0.106.0 class of error: a bad fixture added without verification).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Opt JavaScript actions onto Node 24 before GitHub's June 16, 2026 forced
# migration. Silences the Node 20 deprecation warning. Matches every other
# workflow in this repo, which already sets this.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Bounded network behaviour for every `npm ci` below. npm's defaults retry twice but allow five minutes per request, so a stalled
  # registry connection looked like a hang. A 60 s request deadline with five retries turns a stall into a quick, automatic retry, and
  # the step-level `timeout-minutes` on each install is the backstop if the registry is down entirely.
  NPM_CONFIG_FETCH_TIMEOUT: '60000'
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '2000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '30000'

jobs:
  # THE TEST GATE, SHARDED, UNDER THE SAME REQUIRED NAME
  # ---------------------------------------------------
  # `npm test` as one job took about 13 to 14 minutes and was the slowest stage of every pull request. It is now three pieces:
  #
  #   - `test-shard`: a matrix of four legs, each running `npm test` with AGENTIC_SECURITY_TEST_SHARD=i/4 on its own runner
  #     (scripts/run-unit-tests.mjs partitions the derived file list; the extras run in shard 1 only). `fail-fast` is off so every
  #     failing shard shows its own failure instead of being cancelled by the first.
  #   - `test-bundle`: the committed-bundle check (build, then a diff of the bundle and its sidecar against the commit). It runs ONCE,
  #     in parallel with the shards, not inside every shard.
  #   - `test`: the aggregator. Branch protection and .github/required-checks.json require a check named exactly `test`, so that name is
  #     kept and still means "the whole suite passed". It `needs` both jobs above and runs with `if: always()`: without it, a failed
  #     dependency would SKIP this job, and a skipped required check is reported as passing by branch protection. It fails unless
  #     both results are exactly `success`, so a failed, skipped or cancelled shard all fail it.
  #
  # scanner/test/ci-test-shards.test.js pins this shape from the workflow text. The shard check names are listed in
  # .github/required-checks.json as blocking: a failed shard already fails `test`, so listing them adds no new way to be red, and it
  # keeps the release gate's hosted-CI check from warning about unclassified runs.
  test-shard:
    name: test-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    defaults:
      run:
        working-directory: scanner
    steps:
      # setup-node v5 added automatic package-manager caching, but it only
      # engages when package.json declares `packageManager` (or
      # devEngines.packageManager) as npm. This repo declares neither, so the
      # v4 -> v7 bump is behaviour-preserving here and no `package-manager-cache`
      # input is needed. If a `packageManager` field is ever added, revisit:
      # auto-caching would then start looking for a lockfile.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        timeout-minutes: 10
      - name: Allow unprivileged user namespaces (the Nix script witnesses need a real confinement primitive)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>&1 || true
          sudo sysctl -w user.max_user_namespaces=15000 2>&1 || true
      - name: Unit + integration test gate (shard ${{ matrix.shard }})
        env:
          AGENTIC_SECURITY_TEST_SHARD: ${{ matrix.shard }}
        run: npm test

  test-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        timeout-minutes: 10
      - name: Build bundle
        run: npm run build
      - name: Verify committed bundle matches source
        run: git diff --exit-code dist/agentic-security.mjs dist/agentic-security.mjs.sha256

  # The required check. No checkout and no install: it only reads the results of the jobs it needs, and does so even when they
  # failed, were skipped or were cancelled (`if: always()`). Anything other than exactly `success` fails it.
  test:
    needs: [test-shard, test-bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the bundle check must have succeeded
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
          BUNDLE_RESULT: ${{ needs.test-bundle.result }}
        run: |
          echo "test-shard: $SHARDS_RESULT"
          echo "test-bundle: $BUNDLE_RESULT"
          if [ "$SHARDS_RESULT" != "success" ] || [ "$BUNDLE_RESULT" != "success" ]; then
            echo "::error::the test gate did not fully succeed (test-shard=$SHARDS_RESULT, test-bundle=$BUNDLE_RESULT)"
            exit 1
          fi

  # Haskell and Nix/NixOS support (HASKELL_NIXOS_FULL_CAPABILITY_PRD.md, QA-004).
  #
  # `npm test` already runs test:haskell, test:nix and test:language through the combined invocation, so these jobs are the
  # EXPLICIT selection: each critical suite is a named step with its own deadline, a missing npm script fails the step (npm exits
  # non-zero for an unknown script) and an empty file list fails (node --test with no files is an error here, not a pass).
  # scanner/test/language/language-package-ci.test.js pins that every one of these steps exists.
  language-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --version && npm --version
      - run: npm ci
        timeout-minutes: 10
      - name: Allow unprivileged user namespaces (the Nix script witnesses need a real confinement primitive)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>&1 || true
          sudo sysctl -w user.max_user_namespaces=15000 2>&1 || true
      - name: Haskell suites
        run: npm run test:haskell
        timeout-minutes: 10
      - name: Nix and NixOS suites
        run: npm run test:nix
        timeout-minutes: 10
      - name: Language suites (accuracy regression, end-to-end matrix, privacy, secrets, governance, assurance)
        run: npm run test:language
        timeout-minutes: 25
      - name: Support registry is current (fails on any drift from the stored measurement)
        run: npm run bench:language-support:check
        timeout-minutes: 5
      - name: CLI-driven language suites (capability matrix, packed tarball, example capture, scan modes)
        run: npm run test:language-slow
        timeout-minutes: 40
      - name: The existing mandatory benchmark gates do not regress (QA-002.AC02)
        run: npm run test:language-gates
        timeout-minutes: 30
      - name: Scale and memory stress (offline)
        run: npm run test:language-stress
        timeout-minutes: 20

  # The criteria that need a real compiler. An unavailable compiler is a FAILED criterion, never a skip, so this job installs one
  # (pinned to an exact version) and runs the files that cannot pass without it.
  language-tools-ghc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.2.1'
        timeout-minutes: 15
      - run: ghc --version && cabal --version
        timeout-minutes: 5
      - name: Provision the packages the route fixtures import (the compile criterion needs them installed)
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update \
              && timeout 180 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y libpq-dev; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::apt failed after 3 attempts" >&2; exit 1; }
            echo "apt attempt $attempt failed or timed out" >&2; sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if timeout 300 cabal update; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::cabal update failed after 3 attempts" >&2; exit 1; }
            echo "cabal update attempt $attempt failed or timed out" >&2; sleep $((attempt * 10))
          done
          cabal install --lib --package-env=default --allow-newer --index-state=2026-10-04T17:05:37Z --constraint='crypton==1.0.6' --constraint='memory==0.18.0' --constraint='jose==0.11' scotty-0.20.1 wai warp servant-server servant-auth-server postgresql-simple yesod http-types text
        timeout-minutes: 25
      - run: npm ci
        timeout-minutes: 10
      - name: Route fixtures compile and the support gate that consumes the result
        run: npm run test:language-tools
        timeout-minutes: 15

  # NixOS architecture checks with a real Nix. INFORMATIONAL, like jetbrains-plugin: the installer and a channel fetch are network
  # events, so a failure here is more often the network than this code. The offline half (parser, module resolver, hardening rules,
  # isolated-evaluation harness with a fake evaluator) is blocking in language-suites. Nix is pinned to an exact release.
  # NIX-012. The suite needs a real NixOS host (/etc/NIXOS), which a hosted Ubuntu runner is not, so the flake's `nixos-host` check boots a
  # throwaway NixOS guest in QEMU and runs the suite inside it. The host never activates a configuration. x86_64 uses KVM; the arm runner
  # covers aarch64. INFORMATIONAL until the job has a recorded green run: see .github/required-checks.json.
  nixos-runtime:
    name: nixos-runtime (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: x86_64-linux }
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    continue-on-error: true
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enable KVM for the VM test
        if: matrix.system == 'x86_64-linux'
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      # Two bounded attempts. The installer is a network download that has hung before; a hang becomes a 10 minute failure of
      # attempt 1 and attempt 2 runs. BOTH attempts stay visible in the log; attempt 2 is skipped when attempt 1 succeeds, and a
      # failure of attempt 2 fails the job.
      - name: Install Nix (attempt 1)
        id: nix_install_1
        uses: cachix/install-nix-action@v31
        continue-on-error: true
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - name: Install Nix (attempt 2, only when attempt 1 failed or timed out)
        if: steps.nix_install_1.outcome != 'success'
        uses: cachix/install-nix-action@v31
        timeout-minutes: 10
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix --version
        timeout-minutes: 5
      - run: npm ci
        timeout-minutes: 10
      - name: Isolated evaluation harness against a real evaluator
        run: node --test test/nix/nix-eval-isolation.test.js
        timeout-minutes: 10
      - name: The flake builds from its committed lock
        working-directory: .
        run: nix build .#agentic-security --no-link --print-out-paths
        timeout-minutes: 15
      # x86_64 only: the arm runner has no /dev/kvm, and a software-emulated NixOS guest does not boot within any usable time (measured).
      - name: Controlled NixOS VM test (runs the NIX-012 suite inside a NixOS guest)
        if: matrix.system == 'x86_64-linux'
        working-directory: .
        run: |
          set -o pipefail
          nix build .#checks.${{ matrix.system }}.nixos-host -L --out-link result-host
          cat result-host/nixos-host-${{ matrix.system }}.tap
        timeout-minutes: 30
      # NIX-012.AC03: "an aarch64-linux runner or actual tested emulation". The arm runner has no KVM, so the aarch64 guest is emulated (qemu
      # TCG) on the x86_64 KVM host. It is slow by nature; the driver's shell wait is stretched in flake.nix. The build step registers the
      # aarch64 user-mode emulator so the few aarch64 derivations (the package, the dev shell) can be built on this host.
      - name: Register the aarch64 user-mode emulator
        if: matrix.system == 'x86_64-linux'
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            if timeout 300 docker run --privileged --rm tonistiigi/binfmt --install arm64; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::binfmt registration failed after 3 attempts" >&2; exit 1; }
            echo "binfmt attempt $attempt failed or timed out" >&2; sleep $((attempt * 10))
          done
          sudo sh -c 'echo "extra-platforms = aarch64-linux" >> /etc/nix/nix.conf'
          sudo systemctl restart nix-daemon
        timeout-minutes: 15
      # The emulated guest is run at most TWICE, and never silently. Attempt 1 is allowed to fail without failing the job only so that
      # attempt 2 can run; its log is kept as an artifact, a warning annotation and the job summary say plainly that attempt 1 failed, and
      # a failure of attempt 2 fails the job. A run that needed the retry is therefore visible as such, and counting those runs is how the
      # flake rate is measured (see the note in flake.nix above mkHostTest).
      - name: Emulated aarch64 NixOS guest, attempt 1 (runs the NIX-012 suite inside it)
        id: aarch64_try1
        if: matrix.system == 'x86_64-linux'
        continue-on-error: true
        working-directory: .
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.nixos-host-aarch64-emulated -L --out-link result-aarch64 2>&1 | tee /tmp/aarch64-attempt-1.log
          cat result-aarch64/nixos-host-aarch64-linux.tap
        timeout-minutes: 150
      - name: Keep the log of a failed attempt 1
        if: always() && steps.aarch64_try1.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: nixos-aarch64-emulated-attempt-1-log
          path: /tmp/aarch64-attempt-1.log
          if-no-files-found: warn
        timeout-minutes: 10
      - name: Emulated aarch64 NixOS guest, attempt 2 (only because attempt 1 failed)
        id: aarch64_try2
        if: matrix.system == 'x86_64-linux' && steps.aarch64_try1.outcome == 'failure'
        working-directory: .
        run: |
          set -o pipefail
          echo "::warning title=emulated aarch64 attempt 1 FAILED::attempt 1 failed (its log is the nixos-aarch64-emulated-attempt-1-log artifact); retrying once. This job is only green if attempt 2 passes, and it is recorded as a retried run."
          echo "### Emulated aarch64 guest: attempt 1 FAILED, attempt 2 running" >> "$GITHUB_STEP_SUMMARY"
          echo '--- tail of the attempt 1 log ---'
          tail -n 60 /tmp/aarch64-attempt-1.log || true
          echo '--- attempt 2 ---'
          nix build .#checks.x86_64-linux.nixos-host-aarch64-emulated -L --out-link result-aarch64 2>&1 | tee /tmp/aarch64-attempt-2.log
          cat result-aarch64/nixos-host-aarch64-linux.tap
          echo "### Emulated aarch64 guest: attempt 1 failed, attempt 2 PASSED (retried run, suspected flake)" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 150
      - name: Keep the log of a failed attempt 2
        if: always() && steps.aarch64_try2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: nixos-aarch64-emulated-attempt-2-log
          path: /tmp/aarch64-attempt-2.log
          if-no-files-found: warn
        timeout-minutes: 10
      - name: The NixOS example scans, and the opt-in evaluation states what it did
        run: |
          set -o pipefail
          AGENTIC_SECURITY_NIX_EVAL=1 AGENTIC_SECURITY_NIX_TARGET=nixosConfigurations.edge-1.config.system.build.toplevel.drvPath \
            node bin/agentic-security.js scan ../examples/nixos-host/fixed --format json | node -e '
              const h = JSON.parse(require("fs").readFileSync(0, "utf8")).scanHealth.languageCoverage.optionalModes["nix-eval"];
              console.log(JSON.stringify(h));
              if (!h.selected) process.exit(1);
            '
        timeout-minutes: 10

  # The Chrome rendering tests (PNG/PDF/SVG export) are quarantined from `npm test`: see scanner/test/helpers/chrome-gate.js. They run
  # here, deadlines unchanged, as their own job. INFORMATIONAL: their duration depends on Chrome and the runner, not on the code.
  chrome-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: google-chrome --version
      - run: npm ci
        timeout-minutes: 10
      - name: Chrome export tests (a run with Chrome unusable would skip them all, so the count is checked)
        run: |
          set -o pipefail
          npm run test:chrome | tee /tmp/chrome.log
          grep -q "^ℹ skipped 0" /tmp/chrome.log
        timeout-minutes: 15

  # PRD F11.1 — the VS Code extension is a shipped surface and its bundle is
  # committed, so it can go stale exactly the way the scanner bundle can.
  #
  # This is the byte-exact half of the check. The dependency-free half runs in
  # the scanner suite (test/ide-surfaces.test.js) and asserts the committed
  # bundle carries the current resolution logic; it cannot rebuild, because CI
  # only installs dependencies under scanner/. This job installs ide/vscode and
  # does the real comparison.
  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        timeout-minutes: 10
      - name: Build the extension bundle
        run: npm run build
      # `ide/vscode/dist/` is gitignored — the extension is packaged by `vsce`,
      # not committed the way `scanner/dist/` is. The first version of this job
      # ran `git diff --exit-code dist/extension.js` on an UNTRACKED file, which
      # can never report a difference: a vacuous gate that looked like coverage.
      # So the BUILT output is inspected instead, which is the thing this job is
      # uniquely able to see.
      - name: The built bundle carries the current resolution logic
        run: |
          node -e '
            const fs = require("fs");
            const b = fs.readFileSync("dist/extension.js", "utf8");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };
            if (!b.includes("CLAUDE_PLUGIN_ROOT")) fail("built bundle does not consult CLAUDE_PLUGIN_ROOT");
            if (/agentic-security["\x27\/\\,\s]+[^\n]{0,20}0\.1\.0/.test(b)) fail("built bundle still carries the dead 0.1.0 cache path");
            for (const c of (pkg.contributes && pkg.contributes.commands) || []) {
              if (!b.includes(c.command)) fail("built bundle does not register " + c.command);
            }
            console.log("built bundle OK: resolution logic present, no dead path, all commands registered");
          '
      # The build is esbuild, which STRIPS types without checking them, so a
      # type error in extension.ts shipped silently. This was a recorded gap
      # until 0.142.0; closing it found real errors immediately — the tsconfig
      # pulled in no Node types at all, so `process`, `setTimeout` and
      # `NodeJS.Timeout` were all unresolved, plus two implicit `any`
      # parameters on the execFile callback.
      - name: Type-check
        run: npm run typecheck

  # PRD F11.1 — the Neovim distribution, actually loaded.
  #
  # `ide/nvim` ships a plugin that Neovim auto-loads from runtimepath. Nothing
  # ever started an editor and asked whether it loads: a syntax error or a
  # missing function in the lua would present to a user as "the plugin does
  # nothing", which is exactly the failure mode the LSP binary had before
  # test/lsp-protocol-smoke.test.js.
  #
  # Headless, no LSP server started: `setup()` only registers a FileType
  # autocmd, so this asserts the plugin LOADS, its module resolves, setup()
  # runs without error, and the load guard is set. Starting a real server
  # belongs to the LSP smoke test, which already does it.
  nvim-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        # Each attempt is capped at 3 minutes and the package manager's own fetch timeout is 30 s, so a stalled mirror fails fast and
        # is retried (this step once hung for 55 minutes).
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update \
              && timeout 180 sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y neovim; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out" >&2
            sleep $((attempt * 10))
          done
          echo "::error::could not install neovim after 3 attempts" >&2
          exit 1
        timeout-minutes: 12
      - name: The plugin loads and setup() runs
        run: |
          nvim --headless -u NONE \
            --cmd "set runtimepath+=$PWD/ide/nvim" \
            -c "runtime! plugin/*.lua" \
            -c "lua local ok, m = pcall(require, 'agentic-security'); if not ok then error('require failed: ' .. tostring(m)) end; local ok2, err = pcall(m.setup, {}); if not ok2 then error('setup() failed: ' .. tostring(err)) end; if vim.g.loaded_agentic_security ~= 1 then error('plugin/ did not set its load guard') end; print('nvim plugin OK')" \
            -c "qa!"

  # PRD F11.1 — the JetBrains distribution, actually built.
  #
  # INFORMATIONAL, deliberately (see .github/required-checks.json). The build
  # downloads a full IntelliJ distribution, so a failure here is far more often
  # the network or a JetBrains release than a statement about this code, and a
  # gate that is habitually red stops being read. The correctness half — that
  # plugin.xml's factoryClass resolves to the Kotlin class it names — is a
  # blocking assertion in test/ide-surfaces.test.js and runs offline in
  # milliseconds.
  jetbrains-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ide/jetbrains
    steps:
      - uses: actions/checkout@v7
      # JDK 21, not 17. IntelliJ Platform 2024.2 requires it; building against 17
      # still produces a zip, and only `verifyPluginProjectConfiguration` says
      # the artifact is wrong. See ide/jetbrains/build.gradle.kts.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 10
      # No `gradle-version:` pin any more. The version lives in the committed
      # wrapper (ide/jetbrains/gradle/wrapper/gradle-wrapper.properties, with the
      # distribution checksum pinned), so CI and a developer's machine run the
      # same Gradle by construction rather than by two settings agreeing.
      #
      # The pin existed because `org.jetbrains.intellij` 1.17.4 cannot be applied
      # by Gradle 9 at all. That plugin is gone — this builds on the IntelliJ
      # Platform Gradle Plugin 2.x.
      - uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 10
      - name: Build and verify the plugin
        # `set -o pipefail` is load-bearing, not decoration. The default shell
        # for a `run:` step is `bash -e {0}` — NO pipefail — so the exit status
        # of `gradle | tee` is TEE's, and a failed build would report success.
        # Verified: `bash -e -c 'false | tee /dev/null'` exits 0.
        run: |
          set -o pipefail
          ./gradlew --no-daemon buildPlugin verifyPluginProjectConfiguration verifyPluginStructure | tee /tmp/gradle.log
        timeout-minutes: 40
      - name: No plugin configuration issues were reported
        # `verifyPluginProjectConfiguration` REPORTS problems and still exits 0.
        # It found two real ones on this plugin — compiling against Java 17 for a
        # platform that requires 21, and double-bundling the Kotlin stdlib — while
        # the build was green. A warning nothing fails on is a warning nobody
        # reads, so the job fails on its output.
        run: |
          if grep -q "plugin configuration issues were found" /tmp/gradle.log; then
            echo "FAIL: verifyPluginProjectConfiguration reported issues:"
            sed -n '/plugin configuration issues were found/,/^> Task/p' /tmp/gradle.log
            exit 1
          fi
        timeout-minutes: 10
      - name: A distribution zip was produced, and it contains the plugin
        run: |
          ZIP="$(find build/distributions -name '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "FAIL: buildPlugin produced no distribution zip"; exit 1; }
          # A zip on its own proves nothing — an empty one would pass. The
          # factoryClass named in plugin.xml must be in the jar, or the plugin
          # dies with ClassNotFoundException at IDE startup.
          unzip -o -q "$ZIP" -d /tmp/plugzip
          JAR="$(find /tmp/plugzip -name 'agentic-security-*.jar' -print -quit)"
          test -n "$JAR" || { echo "FAIL: no plugin jar inside the distribution"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/clearcapabilities/agenticsec/AgenticSecurityServerFactory.class' \
            || { echo "FAIL: the factoryClass plugin.xml names is not in the jar"; unzip -l "$JAR"; exit 1; }

  # Exercises the kernel-namespace confinement backend for real.
  #
  # Hosted runners ship with unprivileged user-namespace creation restricted by
  # the kernel's access-control layer, which is why the backend's functional
  # probe fails there and its escape tests skip. Runners do have passwordless
  # root, so this job relaxes the restriction for itself and then runs the
  # existing escape suite unchanged. Nothing about the tests or the confinement
  # is weakened to make them run — the only thing changed is the HOST policy
  # that forbids an unprivileged process from creating the namespaces at all.
  #
  # The job prints the selected backend and RAN/SKIPPED per test, and the
  # runner script exits non-zero if the namespace suite skipped. A skip can
  # therefore never be mistaken for a pass here.
  sandbox-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: scanner
        timeout-minutes: 10

      - name: Host state before relaxing the restriction
        run: |
          uname -a
          echo "--- namespace-related knobs (before) ---"
          for k in kernel.apparmor_restrict_unprivileged_userns \
                   kernel.unprivileged_userns_clone \
                   user.max_user_namespaces; do
            sysctl "$k" 2>&1 || true
          done
          echo "--- can an unprivileged process create the namespaces? (before) ---"
          if unshare --user --map-root-user --mount --pid --ipc --uts --net --fork /bin/sh -c 'exit 0' 2>&1; then
            echo "EXIT_BEFORE=0"
          else
            echo "EXIT_BEFORE=$?"
          fi

      - name: Relax the unprivileged user-namespace restriction for this job
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>&1 || true
          sudo sysctl -w user.max_user_namespaces=15000 2>&1 || true

      - name: Host state after relaxing the restriction
        run: |
          echo "--- namespace-related knobs (after) ---"
          for k in kernel.apparmor_restrict_unprivileged_userns \
                   kernel.unprivileged_userns_clone \
                   user.max_user_namespaces; do
            sysctl "$k" 2>&1 || true
          done
          echo "--- can an unprivileged process create the namespaces? (after) ---"
          if unshare --user --map-root-user --mount --pid --ipc --uts --net --fork /bin/sh -c 'exit 0' 2>&1; then
            echo "EXIT_AFTER=0"
          else
            echo "EXIT_AFTER=$?"
          fi

      - name: Control — outbound egress succeeds UNCONFINED
        # Without this, "egress was blocked inside the sandbox" would also hold
        # on a runner with no egress at all, i.e. it would prove nothing.
        run: |
          if bash -c 'exec 3<>/dev/tcp/1.1.1.1/443' 2>&1; then
            echo "EXIT_UNCONFINED_EGRESS=0"
          else
            echo "EXIT_UNCONFINED_EGRESS=$?"
          fi

      # Runs the escape suite, the capability-mode execution suite (its probes
      # and their fault-injection counterparts), and the active probes once more
      # as an evidence table. Exits non-zero if any required suite SKIPPED, any
      # required control is not proved, or a control that must stay unasserted
      # (process-count caps, network mediation) claims to be proved. A runner
      # that cannot establish the namespaces therefore FAILS this job.
      - name: Sandbox escape suite and Linux control probes (fails if any required suite SKIPPED)
        run: node scripts/sandbox-linux-verify.mjs

      - name: Upload the probe evidence table
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: sandbox-linux-evidence
          path: ${{ runner.temp }}/sandbox-linux-evidence.json
          if-no-files-found: warn

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: scanner
        timeout-minutes: 10
      - name: CVE-replay corpus baseline check (fails on any drift)
        run: npm run bench:cve-replay:check
        working-directory: scanner

      # Reports the corpus's provenance mix on every run — 98% self-authored
      # synthetic fixtures — and fails when a commit lands a detector together
      # with the corpus entries exercising it. Keeping the composition in the
      # log is the point: a detection rate at the ceiling means something very
      # different for a self-authored corpus than for a sampled one.
      - name: Corpus provenance (composition + detector/entry coupling)
        run: npm run corpus:provenance
        working-directory: scanner

  # R4 — determinism as a contract, cross-machine half.
  #
  # The attestation module already proves that emission order, timestamps and
  # run ids cannot move the digest. What it could NOT prove is the claim people
  # actually care about: that a different machine, running the same commit,
  # reaches the same answer. That needs two machines, so it lives here.
  #
  # The comparison is between LIVE runs of the same commit, not against a
  # committed reference digest. A checked-in digest would need refreshing on
  # every commit that legitimately changes a finding, which turns the gate into
  # a chore and trains reviewers to rubber-stamp it. Comparing runs has no such
  # drift and tests exactly the claimed property.
  #
  # The fixture is dependency-free on purpose: an SCA finding depends on the
  # OSV/KEV cache, so a cold cache on one runner would surface as a determinism
  # failure that is really a network difference. `attest-fixture.mjs` also
  # exits non-zero if the fixture yields zero findings — every machine agrees
  # on an empty set, and that agreement is worth nothing.
  determinism-attest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: scanner
        timeout-minutes: 10
      - name: Compute run attestation
        # pipefail, same reason as the jetbrains-plugin build step: without it
        # the step's exit status is TEE's, so attest-fixture.mjs could fail —
        # including on its own "zero findings" refusal — and this BLOCKING job
        # would go green having uploaded an empty attestation for
        # determinism-compare to compare against.
        run: |
          set -o pipefail
          node scripts/attest-fixture.mjs --json | tee "attestation-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: attestation-${{ matrix.os }}
          path: attestation-${{ matrix.os }}.json
        timeout-minutes: 10

  determinism-compare:
    needs: determinism-attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: attestation-*
          merge-multiple: true
          path: attestations
        timeout-minutes: 10
      - name: All machines must agree on the digest
        run: node scripts/determinism-compare.mjs attestations
