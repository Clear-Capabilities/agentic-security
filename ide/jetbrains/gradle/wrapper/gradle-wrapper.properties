distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# The wrapper downloads a Gradle distribution over the network on first run.
# Without this checksum it would accept whatever arrives. `gradle wrapper` does
# not add it by default; in this repository it is not optional.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
