# The Kotlin Gradle plugin adds kotlin-stdlib as a dependency automatically, and
# the IntelliJ Platform already bundles its own. Shipping both put a 1.7 MB
# kotlin-stdlib-2.1.0.jar inside the distribution zip alongside the 5 KB of
# plugin code, and the platform's class loader can then resolve stdlib classes
# from either — the failure mode is a ClassNotFoundException or a version
# mismatch at runtime, in the IDE, not here.
#
# `verifyPluginProjectConfiguration` reports this, and reported it while the
# build was still exiting 0. That is why the CI job now fails on its output
# rather than only on the build's exit code.
kotlin.stdlib.default.dependency=false
