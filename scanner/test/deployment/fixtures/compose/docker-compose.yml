services:
  web:
    image: example/web:1
    ports:
      - "8080:80"
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - cache
    environment:
      API_TOKEN: "compose-secret-token-value"
    networks: [frontend]
  api:
    image: example/api:1
    labels:
      tenant: acme
    depends_on:
      db:
        condition: service_started
    networks: [frontend, backend]
  db:
    image: example/db:1
    env_file: ./db.env
    networks: [backend]
networks:
  frontend: {}
  backend:
    internal: true
