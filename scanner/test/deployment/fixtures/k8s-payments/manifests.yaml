apiVersion: v1
kind: ServiceAccount
metadata: {name: payments-sa, namespace: payments}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: payments, labels: {app: api}}
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, tenant: acme}}
    spec:
      serviceAccountName: payments-sa
      containers:
        - name: api
          image: registry.example/payments-api:1.0
          env:
            - {name: DB_PASSWORD, value: "hunter2-super-secret"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: payments}
spec:
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      serviceAccountName: ledger-sa
      containers: [{name: ledger, image: registry.example/ledger:1.0}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: payments}
spec:
  type: ClusterIP
  selector: {app: api}
---
apiVersion: v1
kind: Service
metadata: {name: orphan, namespace: payments}
spec:
  selector: {app: nothing}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: public, namespace: payments}
spec:
  tls: [{hosts: [pay.example.com]}]
  rules:
    - host: pay.example.com
      http:
        paths:
          - {path: /v1, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
          - {path: /missing, pathType: Prefix, backend: {service: {name: not-here, port: {number: 80}}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: reader, namespace: payments}
rules:
  - {apiGroups: [""], resources: [configmaps], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-reader, namespace: payments}
roleRef: {kind: Role, name: reader}
subjects: [{kind: ServiceAccount, name: payments-sa, namespace: payments}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ledger-only-api, namespace: payments}
spec:
  podSelector: {matchLabels: {app: ledger}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: api}}}]
---
apiVersion: v1
kind: Secret
metadata: {name: db, namespace: payments}
stringData: {password: "should-never-appear"}
