apiVersion: v1
kind: ServiceAccount
metadata: {name: billing-sa, namespace: billing}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing-api, namespace: billing}
spec:
  selector: {matchLabels: {app: billing-api}}
  template:
    metadata: {labels: {app: billing-api}}
    spec:
      serviceAccountName: billing-sa
      containers: [{name: api, image: example/billing:1}]
---
apiVersion: v1
kind: Service
metadata: {name: billing-api, namespace: billing}
spec:
  selector: {app: billing-api}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: billing-ingress, namespace: billing}
spec:
  ingressClassName: internal
  rules:
    - host: billing.internal
      http:
        paths:
          - {path: /charge, pathType: Prefix, backend: {service: {name: billing-api, port: {number: 80}}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ledger-writer, namespace: billing}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, update]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: billing-writes, namespace: billing}
roleRef: {kind: Role, name: ledger-writer}
subjects: [{kind: ServiceAccount, name: billing-sa, namespace: billing}]
