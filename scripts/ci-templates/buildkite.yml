# agentic-security CI gate for Buildkite.
# Copy to .buildkite/pipeline.yml.

steps:
  - label: ":lock: agentic-security"
    key: "security"
    command: |
      npx --yes agentic-security ci . --fail-on high
    artifact_paths:
      - ".agentic-security/findings.json"
      - ".agentic-security/findings.sarif"
      - ".agentic-security/findings.junit.xml"
    agents:
      queue: "default"
    plugins:
      - artifacts#v1.9.0:
          upload: [".agentic-security/findings.json", ".agentic-security/findings.sarif", ".agentic-security/findings.junit.xml"]
