# agentic-security CI gate for GitLab CI.
# Copy to your project's .gitlab-ci.yml or include via:
#   include:
#     - local: '.gitlab-ci.agentic-security.yml'

stages:
  - security

agentic-security:
  stage: security
  image: node:24
  script:
    # promoted compiler rules are re-scored against their corpora and the shared false-positive corpus before the scan gate, so a
    # failing gate cannot hide a rule regression; exit 1 on a regression, 0 with none promoted. Set AGENTIC_SECURITY_RULES_PUBLIC_KEY
    # as a CI variable so the committed rule ledger's author signature verifies here (the per-install key that also signs it is not
    # on this runner).
    - npx --yes agentic-security rules regress
    - npx --yes agentic-security ci . --fail-on high
  artifacts:
    when: always
    paths:
      - .agentic-security/findings.json
      - .agentic-security/findings.sarif
      - .agentic-security/findings.junit.xml
    reports:
      sast: .agentic-security/findings.sarif
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
