# agentic-security CI gate for CircleCI.
# Copy to .circleci/config.yml — or merge the agentic-security job into yours.

version: 2.1

jobs:
  agentic-security:
    docker:
      - image: cimg/node:24.10
    steps:
      - checkout
      # promoted compiler rules are re-scored against their corpora and the shared false-positive corpus before the
      # scan gate, so a failing gate cannot hide a rule regression; exit 1 on a regression, 0 with none promoted.
      # Set AGENTIC_SECURITY_RULES_PUBLIC_KEY in the project's environment so the committed rule ledger's author
      # signature verifies here (the per-install key that also signs it is not on this executor).
      - run:
          name: Promoted rule regressions
          command: npx --yes agentic-security rules regress
      - run:
          name: Run agentic-security scan + gate
          command: npx --yes agentic-security ci . --fail-on high
      # when: always — a blocking gate exits non-zero and stops the job;
      # without this, CircleCI skips every step after the failing one and
      # the findings are never uploaded for the run that actually matters.
      - store_artifacts:
          path: .agentic-security/findings.json
          when: always
      - store_artifacts:
          path: .agentic-security/findings.sarif
          when: always
      - store_artifacts:
          path: .agentic-security/findings.junit.xml
          when: always

workflows:
  security:
    jobs:
      - agentic-security
